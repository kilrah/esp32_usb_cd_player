## IDF Component Manager Manifest File
dependencies:
  idf: ">=6.0"
  kilrah/esp_usb_host_atapi:
    # Not in the ESP Component Registry yet: pulled from GitHub at a tag. Once published, drop the git line.
    # To work on the driver, point override_path at a local checkout instead (see AGENTS.md).
    git: https://github.com/kilrah/esp_usb_host_atapi.git
    version: v0.1.4
  # Board support: one board per target (CMakePresets.json). Each provides board.h.
  tdisplay_s3:
    path: ../components/tdisplay_s3
    rules:
      - if: "target == esp32s3"
  jc1060p470_v2:
    path: ../components/jc1060p470_v2
    rules:
      - if: "target == esp32p4"
  s31_coreboard:
    path: ../components/s31_coreboard
    rules:
      - if: "target == esp32s31"
  # Display UI: not built for boards without a display (ESP32-S31-Function-CoreBoard-1)
  espressif/esp_lvgl_port:
    version: "^2.4.0"
    rules:
      - if: "target != esp32s31"
  lvgl/lvgl:
    version: "^9.2.0"
    rules:
      - if: "target != esp32s31"
  espressif/mdns: "^1.15.0"
  joltwallet/littlefs: "^1.23.0"
  espressif/cjson: "^1.7.19"
  espressif/esp_jpeg: "^1.3.2"
